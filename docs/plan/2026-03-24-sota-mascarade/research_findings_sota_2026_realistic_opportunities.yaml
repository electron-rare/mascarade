related_conventions:
  naming_patterns_in_domain: Provider classes are named <Runtime>Provider, env flags follow *_ENABLED / *_BASE_URL / *_TIMEOUT_SECONDS, and machine/operator docs use explicit runbook naming.
  structure_of_domain: Core control logic stays in router.py, runtime-specific transport adapters live in router/providers, and operational guidance lives under docs as runbooks or specs.
  error_handling_in_domain: Local runtime providers surface operator-oriented timeout and HTTP diagnostics instead of silent retries, especially on Apple paths.
  testing_in_domain: Providers use isolated pytest modules with fake httpx clients; orchestrator behavior is verified by mode-specific tests and trace assertions.
  documentation_in_domain: Major runtime additions are accompanied by technical specs plus runbooks and smoke commands, not only code comments.

