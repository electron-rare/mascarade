plan_id: 2026-03-24-sota-mascarade
objective: Synthese courte des opportunites SOTA 2026 les plus realistes pour Mascarade avec focus multi-agents, Apple Intelligence/Foundation Models/CoreML/MLX, evaluation-routing-adaptation locale, documentation et operabilite.
focus_area: sota_2026_realistic_opportunities
created_at: 2026-03-24T00:00:00Z
created_by: GitHub Copilot (GPT-5.4)
status: completed

tldr: |
  - Mascarade dispose deja des briques structurantes qui rendent realistes des lots incrementaux plutot qu'un replatforming: routeur hybride, providers locaux Apple/MLX, orchestration multi-agents, traces runtime, runbooks operatoires.
  - Les opportunites 2026 les plus credibles sont celles qui renforcent des chemins deja presents: graphes d'orchestration durables, evaluation standardisee, routing local adapte par machine, et durcissement des surfaces Apple locales.
  - Les integrations a eviter sont surtout les plateformes lourdes ou les paris materiels trop incertains: framework complet de remplacement, grands modeles distribues sur Macs, dependance totale a Apple Foundation Models, et fallbacks Apple multi-modeles dans une meme requete.
  - Cinq references OSS ressortent comme vraiment utiles pour Mascarade: LangGraph, LiteLLM, MLX/MLX-LM, lm-evaluation-harness, OpenTelemetry Python.
  - Le meilleur prochain lot d'implementation reste centre sur l'evaluation et le routing local: brancher un banc d'eval standard, exposer des profils machine Apple explicites, puis relier proprement Apple Foundation Models au routeur si la cible locale le justifie.

research_metadata:
  methodology: hybrid retrieval via semantic_search + grep_search + targeted read_file + focused web fetch on Apple/Foundation Models, MLX/MLX-LM, LiteLLM, LangGraph, lm-evaluation-harness and OpenTelemetry; relationships expanded from router/provider/orchestrator and runbook files.
  scope: core routing, Apple local inference providers, orchestrator, observability, operator runbooks, existing OSS research, and selected external sources for 2026 maturity signals.
  confidence: high
  coverage: 82

