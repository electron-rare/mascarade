patterns_found:
  - category: architecture
    pattern: Unified provider contract for heterogeneous runtimes
    description: Local Apple runtimes, hosted APIs and distributed providers all implement LLMProvider with send, stream and available_models.
    examples:
      - file: apple_coreml.py
        location: apple_coreml.py:15
        snippet: class AppleCoreMLProvider(LLMProvider)
      - file: apple_fm.py
        location: apple_fm.py:25
        snippet: class AppleFMProvider(LLMProvider)
      - file: mlx_lm.py
        location: mlx_lm.py:26
        snippet: class MLXLMProvider(LLMProvider)
    prevalence: common
  - category: architecture
    pattern: Hybrid routing combining static policy, heuristics and learned classifiers
    description: Route selection is not delegated to a single external framework; it combines explicit policy, heuristics, ML confidence thresholds and fallback scoring.
    examples:
      - file: router.py
        location: router.py:614
        snippet: if self.routing_classifier is not None and self.routing_classifier.is_loaded
      - file: README.md
        location: README.md:45
        snippet: Softmax classifier (17 features) auto-selects best model per prompt
    prevalence: common
  - category: structure
    pattern: OpenAI-compatible shim as the integration seam
    description: Local runtimes are wrapped behind OpenAI-compatible HTTP surfaces to minimize coupling with clients and orchestration code.
    examples:
      - file: AFMServer.swift
        location: AFMServer.swift:21
        snippet: router.get("/v1/models")
      - file: AFMServer.swift
        location: AFMServer.swift:37
        snippet: router.post("/v1/chat/completions")
      - file: APPLE_INTELLIGENCE_SPEC.md
        location: APPLE_INTELLIGENCE_SPEC.md:581
        snippet: expose the frozen /v1/chat/completions contract
    prevalence: common
  - category: operability
    pattern: Runbook-first local runtime management
    description: Local Apple and VM operations are documented with explicit preflight, recovery and smoke-test procedures.
    examples:
      - file: RUNBOOK_APPLE_LLM_LOCAL.md
        location: RUNBOOK_APPLE_LLM_LOCAL.md:15
        snippet: curl /health, /models and smoke_apple_llm.sh
      - file: RUNBOOK_VM_OPS.md
        location: RUNBOOK_VM_OPS.md:136
        snippet: smoke_otel_loki.sh and loki_cardinality_report.sh
    prevalence: common
