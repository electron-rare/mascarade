domain_security_considerations:
  sensitive_areas:
    - area: Local provider and tracing configuration
      location: core/mascarade/config.py
      concern: API keys, tracing credentials and runtime URLs determine exposure of local and remote surfaces.
    - area: Apple Foundation Models usage constraints
      location: developer.apple.com/documentation/foundationmodels
      concern: Access depends on Apple Intelligence enablement and acceptable-use requirements.
  authentication_patterns_in_domain: Core/API deployment is protected through operator-managed env keys and edge proxy posture; local Apple bridges shown here are loopback-oriented.
  authorization_patterns_in_domain: No per-agent authorization layer was identified in the local provider code examined; control appears to be deployment and API-key scoped.
  data_validation_in_domain: Provider bridges mostly rely on typed JSON decode or simple message shaping; stronger request schema validation is more visible at the broader API layer than inside local bridges.

