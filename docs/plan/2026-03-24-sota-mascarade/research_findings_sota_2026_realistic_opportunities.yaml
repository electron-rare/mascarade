    - model listing and caching behavior
    - timeout and HTTP failure surfacing
    - sequential, parallel and pipeline orchestration modes
    - trace emission during orchestration
  test_organization: Per-provider test files under core/tests with mocked clients plus orchestration behavior tests.
  mock_patterns:
    - fake httpx.AsyncClient/httpx.Client implementations
    - monkeypatch of settings module attributes
    - fake cluster and fake provider objects for orchestration tests

realistic_opportunities:
  - title: Durable graph-based multi-agent orchestration on top of current modes
    why_realistic: Mascarade already has sequential, parallel and pipeline modes plus trace hooks; adopting graph execution patterns is an extension, not a rewrite.
    evidence_in_repo:
      - test_orchestrator.py:127
      - test_orchestrator.py:136
      - test_orchestrator.py:145
      - test_orchestrator.py:153
    external_signal:
      - langgraph offers durable execution, memory and human-in-the-loop for long-running stateful agents.
    fit_assessment: high
  - title: Machine-aware local routing between MLX-LM, Apple CoreML and remote fallbacks
    why_realistic: Router already supports strategy/policy/ML classification, while Apple and MLX providers are already present and zero-cost locally.
    evidence_in_repo:
      - router.py:614
      - mlx_lm.py:26
      - apple_coreml.py:15
      - RUNBOOK_APPLE_LLM_LOCAL.md:100
    external_signal:
      - mlx-lm is actively maintained and exposes serving, quantization, prompt caching and distributed inference capabilities.
    fit_assessment: high
  - title: Apple Foundation Models as a constrained tool-capable local lane for structured tasks
    why_realistic: The Swift bridge and Python provider already exist, and Apple documents guided generation, tool calling and locale support for Foundation Models.
    evidence_in_repo:
      - apple_fm.py:25
      - AFMServer.swift:11
      - APPLE_INTELLIGENCE_SPEC.md:261
    external_signal:
      - Apple Foundation Models framework explicitly supports guided generation via Generable and tool calling via Tool.
    fit_assessment: medium_high
  - title: Standardized evaluation loop for routing and local model qualification
    why_realistic: Mascarade already tracks benchmarks and traces, but evaluation remains custom; adding a standard harness uses the existing OpenAI-compatible seams.
    evidence_in_repo:
      - README.md:45
      - README.md:51
      - router.py:730
      - RUNBOOK_APPLE_LLM_LOCAL.md:15
    external_signal:
      - lm-evaluation-harness supports local OpenAI-compatible servers and standardized task configs.
    fit_assessment: high
  - title: Local adaptation per machine profile instead of global one-size-fits-all routing
    why_realistic: The repo already contains machine profiles, next-lot scripts and runbooks that distinguish host capabilities.
    evidence_in_repo:
      - RUNBOOK_VM_OPS.md:149
      - README.md:129
      - TODO_AI_NOVEL_ENGINE.md:73
    external_signal:
      - MLX/Apple local stacks have strong hardware sensitivity; practical 2026 systems increasingly route by device profile, not only by prompt complexity.
    fit_assessment: high
  - title: Operator-grade documentation surfaces for local inference and orchestration regressions
    why_realistic: Existing runbooks, smoke scripts, trace buffer and Langfuse hooks provide the substrate for docs-as-ops hardening.
    evidence_in_repo:
      - RUNBOOK_APPLE_LLM_LOCAL.md:15
      - RUNBOOK_VM_OPS.md:136
      - core/mascarade/server.py:91
      - core/mascarade/router/router.py:1136
    external_signal:
      - OpenTelemetry traces are stable in Python and well suited to codify incident and evaluation workflows.
    fit_assessment: high

avoid_or_delay:
  - title: Full replatforming of orchestration onto CrewAI, Dify or another external platform
    why_defer: Mascarade already differentiates on router + P2P + Apple-local lanes; a framework replacement would discard working internal abstractions without solving the current bottlenecks.
    evidence_in_repo:
      - README.md:20
      - OSS_RESEARCH.md:33
      - OSS_RESEARCH.md:68
  - title: Apple CoreML fallback chains across multiple Apple models in a single request path
    why_defer: The provider explicitly documents the single-model runtime constraint; this is an operational mismatch, not a missing feature toggle.
    evidence_in_repo:
      - apple_coreml.py:17
      - RUNBOOK_APPLE_LLM_LOCAL.md:10
  - title: Large-model distributed Apple inference as a near-term core path
    why_defer: Exo and similar paths exist in specs, but they increase operational fragility and are not needed for the current realistic local Apple lane.
    evidence_in_repo:
      - APPLE_INTELLIGENCE_SPEC.md:134
      - APPLE_INTELLIGENCE_SPEC.md:490
    risk_driver: networked local inference is more complex than the currently validated single-host paths.
  - title: Treating Apple Foundation Models as a universal replacement for local domain models
    why_defer: AFM is attractive for structured and tool-enabled tasks, but its model size, platform gating and current bridge maturity make it a complementary lane, not a universal runtime.
    evidence_in_repo:
      - apple_fm.py:57
      - APPLE_INTELLIGENCE_SPEC.md:265
      - developer.apple.com/documentation/foundationmodels
  - title: Heavy local fine-tuning bets on Apple Neural Engine as the primary adaptation path
    why_defer: Current repo evidence is strongest for MLX/MLX-LM on Apple Silicon and CoreML serving; docs also note MLX is CPU/GPU oriented rather than ANE-first.
    evidence_in_repo:
      - APPLE_SILICON_M5_HISTORY.md:61
      - APPLE_SILICON_M5_HISTORY.md:62
      - TODO_AI_NOVEL_ENGINE.md:61
  - title: Adding more provider wrappers before standardizing evaluation and routing evidence
    why_defer: The router already supports many providers; the missing leverage is standardized qualification, comparative baselines and machine-local adaptation logic.
    evidence_in_repo:
      - README.md:40
      - README.md:45
      - OSS_RESEARCH.md:15

reference_projects:
  - name: langchain-ai/langgraph
    usefulness: Reference for durable, stateful graph orchestration, human-in-the-loop checkpoints and long-running agent workflows.
    why_compare_or_integrate: Best external reference for evolving Mascarade orchestration without replacing its router/provider stack.
    maturity_signal: 27k+ stars, frequent releases, strong production positioning in 2026.
  - name: BerriAI/litellm
    usefulness: Reference or backend for broad provider normalization, cost tracking and gateway semantics.
    why_compare_or_integrate: Useful to reduce provider-maintenance burden while preserving Mascarade-specific routing decisions above it.
    maturity_signal: 40k+ stars, stable release channel, heavy 2026 activity.
  - name: ml-explore/mlx and ml-explore/mlx-lm
    usefulness: Primary Apple Silicon-native stack for local inference, quantization and potentially local adaptation.
    why_compare_or_integrate: Most practical 2026 path for Apple-local performance outside ANE-specific CoreML serving.
    maturity_signal: Active Apple-backed framework and active mlx-lm release cadence.
  - name: EleutherAI/lm-evaluation-harness
    usefulness: Standardized benchmark runner for local servers, HF models and API endpoints.
    why_compare_or_integrate: Direct fit for validating routing, Apple local lanes and fine-tuned domain models through reproducible task configs.
    maturity_signal: 11k+ stars, active releases, local-chat-completions support.
  - name: open-telemetry/opentelemetry-python
    usefulness: Stable tracing and metrics substrate for operational hardening and eval observability.
    why_compare_or_integrate: Mascarade already uses OTEL; this remains the right backbone for docs-as-ops and machine-aware telemetry.
    maturity_signal: traces and metrics marked stable in project status.

next_lot_implementation_candidates:
  - candidate: Standardized local eval lane for routing decisions and Apple/MLX qualification
    concrete_scope:
      - wire lm-evaluation-harness against Mascarade local-chat-completions/OpenAI-compatible surfaces
      - define a small task pack for electronics, structured output, and rewrite quality
      - persist per-machine results beside current runbooks and benchmark metadata
    direct_fit: highest
  - candidate: Machine-profile-aware routing presets for Apple hosts
    concrete_scope:
      - encode preferred local providers by machine profile
      - separate fast local, structured local and quality remote lanes
      - keep Apple CoreML and MLX-LM as distinct capabilities instead of one generic local bucket
    direct_fit: highest
  - candidate: Promote Apple Foundation Models as a narrow structured/task-calling lane
    concrete_scope:
      - verify AppleFMProvider is registered in the active router path when enabled
      - limit use cases to structured extraction, tool invocation and short local assistance
      - compare AFM against MLX/CoreML on locale support and structured-output reliability
    direct_fit: high
  - candidate: Durable orchestration state and replayability
    concrete_scope:
      - extend current sequential/parallel/pipeline engine with graph/checkpoint semantics
      - keep AgentTraceBuffer and Langfuse as the execution record
      - focus on resumability and operator replay before adding new agent personas
    direct_fit: high
  - candidate: Documentation-to-operations tightening
    concrete_scope:
      - align Apple runtime runbooks, smoke scripts and router error messages
      - make next useful lot and machine context outputs first-class operator inputs
      - codify acceptance gates for local Apple candidates before promotion
    direct_fit: high

open_questions:
  - question: Is AppleFMProvider registered in the active runtime path today or only documented/tested?
    context: The provider and tests exist, but the live router snippet read in router.py did not show AppleFMProvider in default provider_specs while specs expect it.
  - question: Which Apple-local use cases matter most for Mascarade: structured extraction, coding assistance, rewrite, or domain reasoning?
    context: Apple Foundation Models and CoreML/MLX each look better suited to different workloads.
  - question: What exact benchmark suite should become the acceptance gate for local routing policies?
    context: The repo has custom benchmark and smoke artifacts, but no single standardized acceptance pack was identified.
  - question: How should machine profiles influence routing policy thresholds and provider priorities?
    context: The repo clearly distinguishes hosts, but the routing evidence examined is still mostly global rather than machine-specific.

gaps:
  - area: Runtime registration drift between docs/specs and active router code
    description: The Apple Foundation Models lane appears documented and tested, but active default registration was not confirmed from the router snippet read.
    impact: Reduces certainty about how close AFM is to production readiness.
  - area: Standardized evaluation package for local providers
    description: Benchmarking exists, but a reproducible harness-backed task pack for routing and Apple-local qualification was not found.
    impact: Makes provider comparison and routing adaptation less auditable.
  - area: Coverage of live Apple FM operator runbooks
    description: Apple CoreML has an explicit runbook; Apple Foundation Models has strong spec coverage but less obvious operator-facing recovery guidance in the files inspected.
    impact: Lowers confidence in day-2 operational maturity for the AFM lane.
