plan_id: 2026-03-24-sota-mascarade
objective: Evaluer le prochain lot technique a faible risque et forte valeur autour de l'UX/auth du cockpit agents apres confirmation que le core expose toujours les agents mais que /api/agents retourne 401 en production.
focus_area: agents_auth_ux
created_at: 2026-03-24T00:00:00Z
created_by: GitHub Copilot GPT-5.4
status: completed

tldr: |
  - La production montre un backend vivant cote core (/health remonte core.agents) mais la gateway applique bien une protection sur /api/agents; un 401 sur cette route est donc compatible avec un cookie de session absent, invalide ou expire, pas avec une disparition des agents.
  - Le web monte deja une gate globale via AuthProvider/AuthGate, mais la detection authRequired depend de /health alors que /health et authMiddleware n'utilisent pas la meme logique de configuration d'auth.
  - Le plus petit lot utile observe est un lot de coherence auth: partager la meme source de verite pour auth_required, tester /api/auth/session, et rendre la page Agents plus explicite quand l'echec vient d'une session manquante/expiree plutot que d'un registre vide.
  - Les fichiers les plus centraux pour ce lot sont api/src/routes/health.ts, api/src/routes/auth.ts, api/src/middleware/auth.ts, web/src/api/client.ts, web/src/auth/AuthContext.tsx, web/src/auth/AuthGate.tsx, web/src/pages/Agents.tsx.
  - La couverture actuelle protege bien le middleware et AuthContext, mais ne couvre pas la route /api/auth/session ni un parcours UX de re-auth sur 401 depuis la page Agents.

