patterns_found:
  - category: architecture
    pattern: Gate globale cote web avant le router
    description: Toute l'application React est montee sous AuthProvider puis AuthGate, donc un 401 sur /api/agents apres bootstrap traduit plutot une session invalide/expiree qu'une absence de garde.
    examples:
      - file: web/src/main.tsx
        location: web/src/main.tsx:12
        snippet: <AuthProvider><AuthGate><App /></AuthGate></AuthProvider>
    prevalence: common
  - category: architecture
    pattern: Routes /api protegees, /api/auth publique
    description: Le backend laisse seulement /api/auth/session hors authMiddleware puis protege /api/agents avant le handler metier.
    examples:
      - file: api/src/index.ts
        location: api/src/index.ts:67
        snippet: app.route("/api/auth", auth); app.use("/api/*", authMiddleware); app.route("/api/agents", agents);
    prevalence: common
  - category: error_handling
    pattern: 401 global -> invalidation du state auth web
    description: Le client api() emet un evenement sur toute 401 et AuthContext remet authenticated a false.
    examples:
      - file: web/src/api/client.ts
        location: web/src/api/client.ts:202
        snippet: if (res.status === 401) { _emit401(); }
      - file: web/src/auth/AuthContext.tsx
        location: web/src/auth/AuthContext.tsx:77
        snippet: useEffect(() => onAuth401(() => setAuthenticated(false)), []);
    prevalence: common
  - category: structure
    pattern: Validation de session par probe /api/agents/providers
    description: Le web n'a pas d'endpoint de session GET; il deduit la validite de la session en appelant une route protegee legere.
    examples:
      - file: web/src/api/client.ts
        location: web/src/api/client.ts:79
        snippet: fetch("/api/agents/providers", { credentials: "include" })
    prevalence: common
  - category: architecture
    pattern: Incoherence entre health et auth reelle
    description: /health calcule auth_required depuis MASCARADE_API_KEY seulement, alors que le middleware accepte aussi le mode database auth via DATABASE_URL.
    examples:
      - file: api/src/routes/health.ts
        location: api/src/routes/health.ts:6
        snippet: function isAuthRequired(): boolean { return (process.env.MASCARADE_API_KEY || "")... }
      - file: api/src/middleware/auth.ts
        location: api/src/middleware/auth.ts:44
        snippet: export function isAuthConfigured(): boolean { return useDatabaseAuth || configuredApiKeys().length > 0; }
    prevalence: occasional
  - category: ux
    pattern: La page Agents ne distingue pas un echec auth d'un echec registre
    description: Le rendu d'erreur affiche un message generic Last refresh failed sans indiquer si la session est expiree.
    examples:
      - file: web/src/pages/Agents.tsx
        location: web/src/pages/Agents.tsx:197
        snippet: message={`Last refresh failed: ${error}`}
    prevalence: common

