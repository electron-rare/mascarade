domain_security_considerations:
  sensitive_areas:
    - area: Session cookie HTTP-only
      location: api/src/routes/auth.ts:41
      concern: L'UX depend entierement de ce cookie; s'il n'est pas pose ou n'est plus envoye, /api/agents retombe immediatement en 401.
    - area: Source de verite auth_required
      location: api/src/routes/health.ts:6
      concern: Une incoherence avec le middleware peut ouvrir ou fermer a tort la gate cote web.
    - area: Cookie ou Bearer interchangeables
      location: api/src/middleware/auth.ts:198
      concern: Le comportement est correct mais doit rester bien teste pour eviter des regressions entre login web et appels scripts.
  authentication_patterns_in_domain: Bearer Authorization ou cookie mascarade_key, validation legacy env keys ou database/core verifyToken.
  authorization_patterns_in_domain: RBAC derive soit du role DB, soit de listes de cles par role via envs MASCARADE_RBAC_*.
  data_validation_in_domain: Longueur minimale de token, comparaison timing-safe pour les cles legacy, actif/inactif verifie cote DB.

testing_patterns:
  framework: Vitest et Playwright
  coverage_areas:
    - Middleware auth 401/403/503 et cookie support
    - AuthContext bootstrap et login/logout
    - E2E statuts sur /api/agents et /health
  test_organization: Tests API sous api/src/**/*.test.ts, tests React sous web/src/**/__tests__/*.test.tsx, smokes end-to-end sous e2e/tests/api
  mock_patterns:
    - Mock de global fetch pour AuthContext
    - Spy sur coreClient pour les routes API
    - Matrices Playwright sur routes protegees

open_questions:
  - question: En production, l'auth utilise-t-elle DATABASE_URL sans MASCARADE_API_KEY ?
    context: Si oui, /health peut declarer auth_required=false alors que /api/agents est protege, ce qui expliquerait une UX incoherente meme sans bug de registre.
  - question: Le 401 observe sur /api/agents arrive-t-il avant login initial ou apres expiration de session existante ?
    context: Le plus petit lot differe legerement entre bootstrap incomplet et re-auth apres expiration.
  - question: Un proxy reverse ou un attribut Secure/SameSite empeche-t-il parfois l'envoi du cookie de session en production ?
    context: Le serveur accepte bien le cookie, mais l'incident peut aussi venir de la couche de transport plutot que du code applicatif.

gaps:
  - area: Route /api/auth/session non testee
    description: Aucun test unitaire cible ne valide POST/DELETE /api/auth/session avec token header/body, cookie pose, ou erreur 401/503.
    impact: Zone non couverte exactement sur le chemin UX le plus critique pour le cockpit.
  - area: UX explicite sur 401 dans la page Agents
    description: Aucune regression test ne verifie qu'une page deja ouverte bascule proprement vers une re-auth claire quand /api/agents ou /api/agents/providers retourne 401.
    impact: Le ressenti utilisateur peut rester ambigu entre panne registre et session expiree.
  - area: Cohesion health/authMiddleware
    description: Aucun test n'assure que auth_required expose par /health suit exactement la meme logique que l'auth reelle.
    impact: Risque de gate web ouverte ou fermee a tort selon le mode d'auth deploye.
