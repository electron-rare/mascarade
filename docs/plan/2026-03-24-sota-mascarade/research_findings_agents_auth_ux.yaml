related_conventions:
  naming_patterns_in_domain: Routes Hono exportees comme const auth/health/agents; helpers auth nommes explicitement isAuthConfigured, validateApiKey, clearApiKey.
  structure_of_domain: Separation nette entre middleware API, routes session publiques, client fetch web, contexte auth React, puis pages qui consomment les endpoints.
  error_handling_in_domain: 401 pour token manquant/invalide, 403 pour role insuffisant, 503 pour fail-closed sans auth configuree; cote web, ApiError normalise le message et AuthContext bascule sur non authentifie a la reception d'un 401.
  testing_in_domain: Unit tests Vitest au niveau middleware et contexte React; smokes Playwright au niveau gateway.
  documentation_in_domain: Peu de documentation inline; le comportement est surtout encode dans les tests et dans les messages de log/commentaires de middleware.

