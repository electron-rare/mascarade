domain_security_considerations:
  sensitive_areas:
    - area: MCP tool invocation from KiCad/plugin flows
      location: finetune/kicad_kic_ai/plugins/mcp_client.py and finetune/kicad_mcp_server/
      concern: Tool exposure breadth and local process access must remain bounded and auditable.
    - area: Finetune launch surface
      location: api/src/routes/finetune.ts and api/src/validation/schemas.ts
      concern: Payload validation is minimal today and does not expose method-level policy controls yet.
    - area: External part data and manufacturing recommendations
      location: KiCad MCP/JLCPCB related flows and fabrication toolkit references
      concern: Stock/pricing/provider data can drift and should not be treated as authoritative without freshness checks.
  authentication_patterns_in_domain: Operator/API access is routed through existing backend surfaces; external companion repos often assume local trusted execution rather than hardened multi-tenant auth.
  authorization_patterns_in_domain: MCP architecture doc frames server-by-domain separation, but fine-grained per-tool authorization is not the dominant pattern in the analyzed domain artifacts.
  data_validation_in_domain: Zod validates pipeline inputs at the API edge, RLVR validates outputs via reward functions, and KiCad/plugin flows rely more on downstream tool success than on strong input schemas.

testing_patterns:
  framework: Mixed targeted tests plus smoke scripts and notebook/script validation.
  coverage_areas:
    - KiCad runtime path and platform helper tests in vendored KiCad MCP tree
    - CAD smoke and component review gating via next_finetune_lots.sh
    - Reward-function based post-generation validation in RLVR
    - Operator-facing registry/status polling in cockpit pages
  test_organization: Core behavior is validated with Python tests and shell smokes; companion KiCad repos keep their own targeted tests; training flows also rely on scripts and notebooks as executable documentation.
  mock_patterns:
    - fall back to demo or local-only environments when external tools are unavailable
    - explicit missing-tool branches such as kibot not found or Unsloth unavailable

open_questions:
  - question: Which companion tree is intended to remain canonical for KiCad MCP behavior inside Mascarade?
    context: The repo contains finetune/kicad_mcp_server and finetune/kicad_kic_ai while backlog items still point to upstream forks, creating possible drift between upstream, vendor tree and runtime assumptions.
  - question: Should the operator-facing finetune API expose alignment_method explicitly?
    context: Core pipeline supports simpo, dpo, kto and rlvr, but the current Hono request schema only exposes task, domain and max_model_size_gb.
  - question: Is manufacturing/component review expected to remain a shell-scripted post-step or become a first-class orchestrator capability?
    context: components-review and cad-tool-smoke are operationally important but still live outside the typed pipeline/API contract.
  - question: Is KiC-AI intended as a standalone companion UX or as a source of patterns to be ported into Mascarade operator/plugin surfaces?
    context: The backlog references it, and a full plugin UX has materially different maintenance cost than borrowing only workflow ideas.
  - question: What level of duplication with TRL/Unsloth is intentional versus technical debt?
    context: Mascarade already has its own RLVR, Unsloth wrapper, many TRL scripts and public docs, so future adoption decisions hinge on whether this diversity is strategic or accidental.

gaps:
  - area: External repo runtime quality signals
    description: This research relied on public docs and code excerpts rather than fresh issue velocity, release cadence or CI health for every external project.
    impact: Maturity and risk levels are directional and comparative, not a substitute for a full due-diligence pass before production adoption.
  - area: Exact upstream/downstream delta for vendored KiCad companion trees
    description: The analysis did not diff Mascarade's in-tree copies against the current upstream heads of KiCAD-MCP-Server, KiC-AI or Fabrication-Toolkit.
    impact: Reuse feasibility is clear at the pattern level, but merge cost and divergence remain unquantified.
  - area: RAG runtime internals beyond high-level architecture
    description: The current pass focused more on KiCad/CAD and finetune/alignment than on deep code-level RAG pipeline internals.
    impact: Haystack-related comparison is accurate as a pattern map but less detailed than the KiCad and finetune comparisons.
  - area: Numerical scoring matrix
    description: The report maps maturity/risk/integration-vs-inspiration factually but does not encode a normalized numeric score per project.
    impact: Human ranking remains straightforward, but downstream automation would require an extra scoring pass.

