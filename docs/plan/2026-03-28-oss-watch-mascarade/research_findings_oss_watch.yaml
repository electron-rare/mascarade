related_conventions:
  naming_patterns_in_domain: Alignment methods are named as lowercase strategy tokens such as simpo, dpo, kto and rlvr; operator pages use explicit nouns such as Training and Pipeline; MCP/CAD vendor trees are grouped under finetune/* companion directories.
  structure_of_domain: Core pipeline logic lives under core/mascarade/finetune, operator surfaces under web/src/pages, API entrypoints under api/src/routes and api/src/validation, and companion experimental/vendor trees under finetune/.
  error_handling_in_domain: Hono routes validate early with Zod and sanitize payloads; core pipeline accumulates state.errors and logs phase failures; RLVR reward functions degrade to explicit score bands when a tool is missing or output is malformed.
  testing_in_domain: Training code mixes scripts, notebook paths and targeted reward/pipeline logic; CAD validation is partially automated via smoke scripts and KiCad DRC-style checks.
  documentation_in_domain: Documentation is extensive and operational, with architecture docs, runbooks, research notes and vendored companion docs used as active design references.

