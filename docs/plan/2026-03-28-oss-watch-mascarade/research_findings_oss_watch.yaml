plan_id: 2026-03-28-oss-watch-mascarade
objective: Veille ciblee sur des projets open source similaires ou directement reutilisables pour Mascarade, avec priorite a l'orchestration d'agents, au RAG agentique, a l'automatisation KiCad/CAD et au fine-tuning/alignment local.
focus_area: oss_watch
created_at: 2026-03-28T00:00:00Z
created_by: GitHub Copilot (GPT-5.4)
status: completed

tldr: |
  - Les trois repos prioritaires sont deja strategiquement alignes avec Mascarade, et meme partiellement presents en vendor tree: KiCad MCP pour le tool plane, KiC-AI pour l'UX in-editor et Fabrication-Toolkit pour le post-design/manufacturing.
  - Cote orchestration et RAG, LangGraph est surtout une source d'inspiration architecturale car Mascarade possede deja un StateGraph maison, tandis qu'AutoGen et Haystack apportent surtout des patterns de runtime multi-agents et de pipeline RAG modulaires plutot qu'un besoin de remplacement.
  - Cote alignment local, TRL et Unsloth sont les references les plus directement exploitables; Mascarade les utilise deja partiellement via son pipeline Unsloth, son RLVR a recompenses verifiables et ses scripts TRL.
  - La meilleure reutilisation concrete a court terme concerne quatre axes: router/registry KiCad MCP, workflows de plugin KiCad local, revue composants/manufacturabilite, et durcissement du pipeline RLVR/GRPO-DAPO expose au cockpit.
  - Le risque principal n'est pas technique pur mais d'integration: duplication de surface entre sous-arbres vendorises, scripts locaux, routes API et vues operateur deja existantes.

research_metadata:
  methodology: hybrid retrieval via semantic_search, grep_search, read_file and github_repo across Mascarade internals and targeted public GitHub references; relationships expanded from MCP architecture, finetune pipeline, training UI, Hono validation layer and vendored KiCad/CAD trees.
  scope: Mascarade MCP/agentics, finetune/alignment local, KiCad/CAD automation, manufacturing review, operator UI/API surfaces, and seven external OSS references selected for direct reuse or architectural comparison.
  confidence: high
  coverage: 88

