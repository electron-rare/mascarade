services:
  kicad-headless:
    image: kicad/kicad:${KICAD_IMAGE_TAG:-9.0}
    container_name: mascarade-kicad-headless
    working_dir: /workspace
    command: ["sleep", "infinity"]
    volumes:
      - ${CAD_WORKSPACE_DIR:-../..}:/workspace
    networks:
      - cad-net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

  kicad-mcp:
    build:
      context: ../../finetune/kicad_mcp_server
      dockerfile: ../../deploy/cad/Dockerfile.kicad-mcp
    container_name: mascarade-kicad-mcp
    working_dir: /workspace
    environment:
      KICAD_PYTHON: /usr/bin/python3
      MCP_TRANSPORT: http
    ports:
      - "8300:8300"
    volumes:
      - ${CAD_WORKSPACE_DIR:-../..}:/workspace
    networks:
      - cad-net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  freecad-headless:
    build:
      context: .
      dockerfile: Dockerfile.freecad-headless
    container_name: mascarade-freecad-headless
    working_dir: /workspace
    command: ["sleep", "infinity"]
    volumes:
      - ${CAD_WORKSPACE_DIR:-../..}:/workspace
    networks:
      - cad-net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  platformio:
    build:
      context: .
      dockerfile: Dockerfile.platformio
    container_name: mascarade-platformio
    working_dir: /workspace
    command: ["sleep", "infinity"]
    volumes:
      - ${CAD_WORKSPACE_DIR:-../..}:/workspace
    networks:
      - cad-net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

networks:
  cad-net:
    name: cad-net
