server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - target_label: job
        replacement: docker
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: '(.+)'
        target_label: 'service'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service', '__meta_docker_container_name']
        separator: ';'
        regex: ';/(.*)'
        target_label: 'service'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: '(.+)'
        target_label: 'compose_service'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        regex: '(.+)'
        target_label: 'compose_project'
      - source_labels: ['__meta_docker_container_log_stream']
        regex: '(.+)'
        target_label: 'stream'
      - source_labels: ['__meta_docker_container_id']
        regex: '(.+)'
        target_label: 'container_id'
    pipeline_stages:
      - json:
          expressions:
            severity: severity
            source: source
            run_id: run_id
            agent_name: agent_name
            event_type: event_type
      - labels:
          severity:
          source:
          run_id:
          agent_name:
          event_type:

  - job_name: systemd-journal
    journal:
      path: /var/log/journal
      # Keep the bootstrap window short so persisted journal segments with bad
      # timestamps do not poison recent machine-log history.
      max_age: 30m
      matches: _BOOT_ID=__PROMTAIL_BOOT_ID__
      labels:
        job: systemd-journal
    relabel_configs:
      - source_labels: ["__journal__systemd_unit"]
        target_label: unit
      - source_labels: ["__journal__hostname"]
        target_label: host
