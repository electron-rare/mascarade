global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "mascarade-core"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "192.168.0.119:8100"
        labels:
          node: "vm-photon"
          role: "gpu"

  - job_name: "mascarade-p2p"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "192.168.0.119:8100"
        labels:
          node: "vm-photon"
      - targets:
          - "192.168.0.210:8100"
        labels:
          node: "cils-macbook"
      - targets:
          - "192.168.0.120:8100"
        labels:
          node: "tower"
