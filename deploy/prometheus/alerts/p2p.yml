groups:
  - name: mascarade_p2p
    interval: 30s
    rules:
      # Un nœud P2P ne répond plus
      - alert: MascaradeP2PPeerDown
        expr: up{job=~"mascarade-p2p.*"} == 0
        for: 2m
        labels:
          severity: warning
          component: p2p
        annotations:
          summary: "P2P node {{ $labels.node }} unreachable"
          description: "mascarade-core on {{ $labels.node }} ({{ $labels.instance }}) has not responded for 2 minutes."

      # Mesh < 3 nœuds actifs (sur 5 attendus)
      - alert: MascaradeP2PMeshTooSmall
        expr: count(up{job=~"mascarade-p2p.*"} == 1) < 3
        for: 5m
        labels:
          severity: warning
          component: p2p
        annotations:
          summary: "P2P mesh has fewer than 3 reachable peers"
          description: "Only {{ $value }} peers are up. Expected at least 3/5 (photon, cils, tower, kxkm-ai, grosmac)."

      # Nœud GPU (KXKM-AI) hors ligne — routage des gros modèles dégradé
      - alert: MascaradeGPUNodeDown
        expr: up{job=~"mascarade-p2p.*", node="kxkm-ai"} == 0
        for: 3m
        labels:
          severity: critical
          component: p2p
        annotations:
          summary: "GPU node kxkm-ai is unreachable"
          description: "Large model requests (devstral 14GB, phi4 9GB) cannot be routed. RTX 4090 has been down for 3+ minutes."

  - name: mascarade_core
    rules:
      # mascarade-core principal hors ligne
      - alert: MascaradeCoreDown
        expr: up{job="mascarade-core"} == 0
        for: 1m
        labels:
          severity: critical
          component: core
        annotations:
          summary: "mascarade-core is down"
          description: "mascarade-core at {{ $labels.instance }} has been unreachable for 1 minute."

  - name: mascarade_rag
    rules:
      # Qdrant vector store down — RAG pipeline degrades silently
      - alert: MascaradeQdrantDown
        expr: up{job="qdrant"} == 0
        for: 2m
        labels:
          severity: critical
          component: rag
        annotations:
          summary: "Qdrant vector store is down"
          description: "RAG search, semantic cache, and embeddings storage are unavailable. Pipeline falls back to LLM-only mode."

      # Redis down — cache and queue unavailable
      - alert: MascaradeRedisDown
        expr: up{job="redis"} == 0
        for: 2m
        labels:
          severity: warning
          component: rag
        annotations:
          summary: "Redis is down"
          description: "Semantic query cache, session state, and task queue are unavailable. RAG queries will be slower but functional."

      # Qdrant high memory usage (>4GB)
      - alert: MascaradeQdrantHighMemory
        expr: process_resident_memory_bytes{job="qdrant"} > 4e9
        for: 10m
        labels:
          severity: warning
          component: rag
        annotations:
          summary: "Qdrant memory > 4GB"
          description: "RSS is {{ $value | humanize }}B. May need collection optimization or memory limit increase."

      # Mémoire RSS anormalement haute (>2GB = possible fuite)
      - alert: MascaradeCoreHighMemory
        expr: process_resident_memory_bytes{job=~"mascarade-.*"} > 2e9
        for: 10m
        labels:
          severity: warning
          component: core
        annotations:
          summary: "mascarade-core memory > 2GB on {{ $labels.node }}"
          description: "RSS is {{ $value | humanize }}B. Possible memory leak or large context accumulation."
