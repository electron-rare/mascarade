global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: ops-agent
    static_configs:
      - targets: ['ops-agent:9200']

  - job_name: loki
    static_configs:
      - targets: ['loki:3100']

  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:13133']

  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']
