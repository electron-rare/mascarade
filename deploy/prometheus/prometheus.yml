global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: ops-agent
    static_configs:
      - targets: ['ops-agent:9200']

  - job_name: loki
    static_configs:
      - targets: ['loki:3100']

  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8888']

  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']

  - job_name: tempo
    metrics_path: /metrics
    static_configs:
      - targets: ['tempo:3200']

  - job_name: litellm
    metrics_path: /metrics
    static_configs:
      - targets: ['litellm:4000']

  - job_name: mascarade-core-p2p
    metrics_path: /metrics
    static_configs:
      - targets: ['core:8100']
        labels:
          component: p2p

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: ['http_2xx']
    static_configs:
      - labels:
          service: edge-proxy
        targets: ['http://edge-proxy/healthz']
      - labels:
          service: n8n
        targets: ['http://n8n:5678/']
      - labels:
          service: langfuse-web
        targets: ['http://langfuse-web:3000/']
      - labels:
          service: dify-api
        targets: ['http://dify-api:5001/health']
      - labels:
          service: dify-web
        targets: ['http://dify-web:3000/']
      - labels:
          service: firecrawl
        targets: ['http://firecrawl:3000/mcp']
      - labels:
          service: mem0
        targets: ['http://mem0:8765/']
      - labels:
          service: grafana
        targets: ['http://grafana:3000/api/health']
      - labels:
          service: tempo
        targets: ['http://tempo:3200/ready']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
