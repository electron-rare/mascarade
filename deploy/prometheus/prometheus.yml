global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/finetune.yml
  - /etc/prometheus/alerts/p2p.yml
  - /etc/prometheus/rules/recording.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: ops-agent
    static_configs:
      - targets: ['ops-agent:9200']

  - job_name: loki
    static_configs:
      - targets: ['loki:3100']

  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8888']

  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']

  - job_name: tempo
    metrics_path: /metrics
    static_configs:
      - targets: ['tempo:3200']

  - job_name: litellm
    metrics_path: /metrics
    static_configs:
      - targets: ['litellm:4000']

  - job_name: finetune-metrics-exporter
    metrics_path: /metrics
    static_configs:
      - targets: ['finetune-metrics-exporter:9101']

  - job_name: nvidia-dcgm-exporter
    metrics_path: /metrics
    static_configs:
      - targets: ['nvidia-dcgm-exporter:9400']

  - job_name: mascarade-p2p
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets: ['192.168.0.119:8100']
        labels:
          node: photon
          role: infra
          chip_family: cpu_only
      - targets: ['192.168.0.210:8100']
        labels:
          node: cils
          role: worker
          chip_family: cpu_only
      - targets: ['192.168.0.120:8100']
        labels:
          node: tower
          role: worker
          chip_family: quadro_p2000
      - targets: ['100.87.54.119:8100']
        labels:
          node: kxkm-ai
          role: gpu
          chip_family: rtx_4090

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: ['http_2xx']
    static_configs:
      - labels:
          service: edge-proxy
        targets: ['http://edge-proxy/healthz']
      - labels:
          service: n8n
        targets: ['http://n8n:5678/']
      - labels:
          service: langfuse-web
        targets: ['http://langfuse-web:3000/']
      - labels:
          service: dify-api
        targets: ['http://dify-api:5001/health']
      - labels:
          service: dify-web
        targets: ['http://dify-web:3000/']
      - labels:
          service: firecrawl
        targets: ['http://firecrawl:3000/mcp']
      - labels:
          service: mem0
        targets: ['http://mem0:8765/']
      - labels:
          service: grafana
        targets: ['http://grafana:3000/api/health']
      - labels:
          service: tempo
        targets: ['http://tempo:3200/ready']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
