networks:
  mascarade-network:
    driver: bridge
services:
  core:
    environment:
      KILL_LIFE_ROOT: /workspace/Kill_LIFE
    volumes:
    - /home/clems/Kill_LIFE:/workspace/Kill_LIFE:rw
  redis:
    container_name: mascarade-redis-dev
    healthcheck:
      interval: 10s
      retries: 10
      start_period: 5s
      test:
      - CMD
      - redis-cli
      - ping
      timeout: 3s
    image: redis:7-alpine
    networks:
    - mascarade-network
    ports:
    - 6379:6379
    restart: unless-stopped
    volumes:
    - redis-data:/data
volumes:
  redis-data: null
