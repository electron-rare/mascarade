# docker-compose.override.yml - Local development overrides
# This file overrides docker-compose.yml for local development

services:
  redis:
    image: redis:7-alpine
    container_name: mascarade-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - mascarade-network

networks:
  mascarade-network:
    driver: bridge

volumes:
  redis-data:
