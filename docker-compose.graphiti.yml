services:
  neo4j:
    image: neo4j:5-community
    container_name: mascarade-neo4j
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
    ports:
      - "${GRAPHITI_BIND_HOST:-127.0.0.1}:7474:7474"
      - "${GRAPHITI_BIND_HOST:-127.0.0.1}:7687:7687"
    environment:
      NEO4J_AUTH: ${GRAPHITI_NEO4J_AUTH:?set GRAPHITI_NEO4J_AUTH}
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "mascarade2026", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - mascarade-network

  graphiti-mcp:
    image: zepai/graphiti:latest
    container_name: mascarade-graphiti-mcp
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    ports:
      - "${GRAPHITI_BIND_HOST:-127.0.0.1}:3550:8000"
    environment:
      NEO4J_URI: bolt://mascarade-neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${GRAPHITI_NEO4J_PASSWORD:?set GRAPHITI_NEO4J_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MODEL_NAME: gpt-4o-mini
      EMBEDDING_MODEL_NAME: text-embedding-3-small
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/docs || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - mascarade-network

volumes:
  neo4j-data:

networks:
  mascarade-network:
    external: true
    name: mascarade-main_mascarade-network
