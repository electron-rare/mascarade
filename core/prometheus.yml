global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'mascarade'
    static_configs:
      - targets: ['localhost:8000']

  - job_name: 'redis'
    static_configs:
      - targets: ['localhost:6379']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['localhost:9100']