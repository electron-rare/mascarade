[project]
name = "mascarade-core"
version = "0.3.0"
description = "Mascarade Core - LLM Orchestration Engine"
authors = [
    {name = "Mascarade Team", email = "team@mascarade.ai"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.135,<1",
    "uvicorn>=0.41,<1",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.13,<3",
    "aiobreaker>=1.2.0,<2",
    "anthropic>=0.84,<1",
    "openai>=2.24,<3",
    "mistralai>=1.12,<2",
    "tenacity>=9.1,<10",
    "notion-client>=3.0,<4",
    "httpx>=0.28,<1",
    "prometheus-client>=0.22,<1",
    "redis[hiredis]>=7.1.1,<8",
    "boto3>=1.35,<2",
    "clickhouse-connect>=0.7,<1",
    "google-auth>=2.41,<3",
    "google-genai>=1.0,<2",
    "python-multipart>=0.0.22,<1",
    "zeroconf>=0.145.0,<1",
    "cryptography>=44.0,<50",
    "huggingface-hub>=1.6.0",
    "asyncpg>=0.30,<1",
    "litellm>=1.60,<3",
]

[project.optional-dependencies]
a2a = [
    "a2a-sdk>=0.3.20,<1",
]
# WARNING: libp2p extra pins redis>=5.2,<6 which CONFLICTS with the core
# redis[hiredis]>=7.1.1 dependency. Do NOT install [libp2p] in the same
# venv as main dependencies. Use a separate virtualenv or Docker image for
# the P2P mesh node. See deploy/docker-compose.yml for isolation pattern.
libp2p = [
    "libp2p>=0.6.0,<1",
    "trio>=0.29,<1",
    "multiaddr>=0.0.9,<1",
    "redis>=5.2,<6",
    "tiktoken>=0.9,<1",
]
# NOTE: finetune and rlvr extras removed from pyproject.toml because
# unsloth requires protobuf<4 which conflicts with libp2p (protobuf>=4.25).
# Finetune deps are installed separately on KXKM-AI GPU in its own venv.
# See: scripts/finetune/requirements.txt
midi = [
    "mido>=1.3,<2",
    "python-rtmidi>=1.5,<2",
]
voice = [
    "faster-whisper>=1.1,<2",
]
reranker = [
    "sentence-transformers>=3.0,<4",
]
langfuse = [
    "langfuse>=2.36,<3",
]
openllmetry = [
    "traceloop-sdk>=0.33,<1; python_version < '3.14'",
]
observability = [
    "traceloop-sdk>=0.33; python_version < '3.14'",
]
eval = [
    "lm-eval>=0.4,<1",
]
dev = [
    "numpy>=2.3,<3",
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=7.0,<8",
    "ruff>=0.15,<1",
    "black>=26.0,<27",
    "mypy>=1.19,<2",
    "pre-commit>=3.7,<4",
]

[tool.setuptools.packages.find]
include = ["mascarade*"]

[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "clients/",
    "finetune/kicad_fabrication_toolkit/",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security)
]
ignore = [
    "E501",  # line too long (handled by black)
    "E701",  # multiple statements on one line (style choice)
    "E741",  # ambiguous variable name (context-dependent)
    "B008",  # function calls in defaults
    "UP042", # str(Enum) pattern intentional for JSON
    "S104",  # hardcoded bind 0.0.0.0 — Docker/P2P networking
    "S105",  # hardcoded password string — config defaults, not secrets
    "S106",  # hardcoded password arg — test fixtures, not secrets
    "S108",  # hardcoded temp file — CAD/hardware workers
    "S110",  # try-except-pass — optional provider imports
    "S301",  # pickle — serialization in node engine
    "S311",  # non-crypto random — acceptable for seeds/load balancing
    "S314",  # XML etree — trusted internal data
    "S603",  # subprocess — we control all inputs
    "S605",  # shell=True — controlled admin scripts
    "S607",  # partial path — tools resolved via PATH
    "S310",  # suspicious URL — validated upstream
    "S608",  # SQL string — will migrate to parameterized incrementally
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "B011", "B017", "B023", "E402"]  # assert, fake creds, raises, closures, late imports
"mascarade/config.py" = ["S104"]  # 0.0.0.0 for Docker
"mascarade/integrations/*" = ["S311"]  # random acceptable for seeds
"mascarade/router/providers/__init__.py" = ["F401"]  # availability checking
"mascarade/router/providers/kicad_router.py" = ["F401"]  # availability checking
"mascarade/router/providers/mlx_provider.py" = ["F401"]  # MLX availability check
"mascarade/router/providers/quantum.py" = ["F401"]  # qiskit availability check
"mascarade/routers/a2a.py" = ["F401"]  # a2a-sdk optional types
"mascarade/cache/semantic_cache.py" = ["F401"]  # gptcache availability check
"mascarade/node_engine/domains/__init__.py" = ["F401"]  # re-exports
"mascarade/node_engine/workers/cad/__init__.py" = ["F401"]  # re-exports
"mascarade/router/providers/*.py" = ["E402"]  # conditional imports after try/except
"mascarade/load_balancer/balancer.py" = ["S311"]  # random for load balancing
"mascarade/router/router.py" = ["E402"]  # conditional imports
"mascarade/p2p/*" = ["S104", "E402"]  # 0.0.0.0 for P2P, conditional imports
"mascarade/tools/*" = ["S104", "S105"]  # SSH hosts and credentials
"mascarade/hardware/*" = ["S104"]  # hardware device binding
"mascarade/node_engine/workers/*" = ["S301"]  # pickle for serialization
"mascarade/finetune/*" = ["S101", "E402"]  # assert in training, late imports
"bert_finetuning_script.py" = ["E402"]  # imports after logging setup
"mascarade/agentic_rag.py" = ["E402"]  # imports after logger setup
"mascarade/node_engine/base.py" = ["F811"]  # error var reused in except chains
"mascarade/node_engine/types.py" = ["UP007"]  # Union syntax for compat
"mascarade/node_engine/worker.py" = ["B027"]  # empty hooks are intentional
"mascarade/scheduler/vllm_integration.py" = ["F821"]  # MLXWorker conditionally defined
"mascarade/cluster.py" = ["S101"]  # assert in cluster validation
"mascarade/cody_gateway.py" = ["F821"]  # health_check defined at runtime
"mascarade/persistence/mcp_persistence.py" = ["B007"]  # loop var for iteration
"mascarade/router/providers/vllm_provider.py" = ["F811"]  # conditional re-import
"tests/node_engine/*" = ["F404", "E402"]  # legacy test structure
"mascarade/server.py" = ["E402"]  # late imports at end of monolith
"scripts/*" = ["E402"]  # scripts have setup before imports
"optimization_script.py" = ["E402"]  # setup before imports

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-ra -q --cov-report=html:htmlcov"
asyncio_mode = "auto"
