[project]
name = "mascarade-core"
version = "0.1.0"
description = "Mascarade Core - LLM Orchestration Engine"
authors = [
    {name = "Mascarade Team", email = "team@mascarade.ai"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.135,<1",
    "uvicorn>=0.41,<1",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.13,<3",
    "aiobreaker>=1.2.0,<2",
    "aiomqtt>=2.0,<3",
    "anthropic>=0.84,<1",
    "openai>=2.24,<3",
    "mistralai>=1.12,<2",
    "tenacity>=9.1,<10",
    "notion-client>=3.0,<4",
    "httpx>=0.28,<1",
    "prometheus-client>=0.22,<1",
    "redis[hiredis]>=7.1.1,<8",
    "boto3>=1.35,<2",
    "clickhouse-connect>=0.7,<1",
    "google-auth>=2.41,<3",
    "google-genai>=1.0,<2",
    "python-multipart>=0.0.22,<1",
    "websockets>=13.0,<14",
    "zeroconf>=0.145.0,<1",
    "cryptography>=44.0,<45",
    "huggingface-hub>=1.6.0",
    "python-rtmidi>=1.5,<2",
    "mido>=1.3,<2",
    "asyncpg>=0.29,<1",
]

[project.optional-dependencies]
libp2p = [
    "libp2p>=0.6.0,<1",
    "trio>=0.29,<1",
    "multiaddr>=0.0.9,<1",
    "redis[hiredis]>=7.1.1,<8",
    "tiktoken>=0.9,<1",
]
finetune = [
    # Unsloth GPU fine-tuning (P3) - auto-detects CUDA, graceful CPU fallback
    "torch>=2.5.0,<3",
    "unsloth>=2024.12",
    "transformers>=4.57.6,<6",
    "peft>=0.18.0,<1",
    "accelerate>=1.12.0,<2",
    "bitsandbytes>=0.46.0,<1",
    "datasets>=4.1.0,<5",
    "trl>=0.25.0,<1",
    "gradio>=5.0,<6",
]
rlvr = [
    "trl>=0.17",
    "kibot>=1.8",
]
observability = [
    "openllmetry-sdk>=0.33",
]
dev = [
    "numpy>=2.3,<3",
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=7.0,<8",
    "ruff>=0.15,<1",
    "black>=26.0,<27",
    "mypy>=1.19,<2",
    "pre-commit>=3.7,<4",
]

[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mascarade*"]
exclude = ["tests*", "data*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security)
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "B011"]  # allow assert in tests
"mascarade/config.py" = ["S104"]  # 0.0.0.0 is required for Docker networking
"mascarade/integrations/comfyui.py" = ["S311"]  # random is acceptable for image generation seeds
"mascarade/router/providers/__init__.py" = ["F401"]  # imports used for availability checking
"mascarade/router/providers/kicad_router.py" = ["F401"]  # imports used for availability checking
"mascarade/load_balancer/balancer.py" = ["S311"]  # random is acceptable for load balancing
"mascarade/router/router.py" = ["E501"]  # line length handled by black
"mascarade/p2p/*" = ["S104"]  # 0.0.0.0 is required for P2P listening

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-ra -q --cov=mascarade --cov-report=term --cov-report=html --cov-branch"
asyncio_mode = "auto"

[tool.coverage.run]
omit = [
    # Experimental P2P features (not in production deployment)
    "mascarade/p2p/*",
    "mascarade/cluster.py",  # P2P clustering functionality

    # Not yet implemented features
    "mascarade/conversation/*",
    "mascarade/resilience/*",

    # Optional voice features
    "mascarade/device_voice.py",

    # Optional integrations
    "mascarade/integrations/*",  # KB, GitHub, ComfyUI, QDrant, etc.
    "mascarade/mcp/*",  # MCP client integration

    # Experimental fine-tuning (P3 feature)
    "mascarade/finetune/*",

    # Optional observability integrations
    "mascarade/observability/otel.py",
    "mascarade/observability/langfuse.py",

    # Analytics (optional, configured separately)
    "mascarade/analytics/*",

    # Provider admin features (optional)
    "mascarade/provider_admin.py",

    # Domain-specific router providers (optional CAD integrations)
    "mascarade/router/providers/kicad_router.py",
    "mascarade/router/providers/apple_coreml.py",
    "mascarade/router/providers/llama_cpp.py",
    "mascarade/router/providers/bedrock.py",  # AWS Bedrock is optional

    # Domain detection and circuit breaking (tested via integration)
    "mascarade/router/circuit_breaker.py",
    "mascarade/router/health_monitor.py",

    # Optional tools
    "mascarade/tools/*",

    # Benchmarking infrastructure (not production code)
    "mascarade/benchmarks/*",

    # Migration scripts (run once, hard to test)
    "mascarade/db/migrations.py",

    # Dependencies module (simple imports, tested via integration)
    "mascarade/dependencies.py",
]
