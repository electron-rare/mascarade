[project]
name = "mascarade-core"
version = "0.1.0"
description = "Mascarade Core - LLM Orchestration Engine"
authors = [
    {name = "Mascarade Team", email = "team@mascarade.ai"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.135,<1",
    "uvicorn>=0.41,<1",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.13,<3",
    "anthropic>=0.84,<1",
    "openai>=2.24,<3",
    "mistralai>=1.12,<2",
    "tenacity>=9.1,<10",
    "notion-client>=3.0,<4",
    "httpx>=0.28,<1",
    "prometheus-client>=0.22,<1",
    "boto3>=1.35,<2",
    "google-auth>=2.41,<3",
    "google-genai>=1.0,<2",
    "python-multipart>=0.0.22,<1",
    "zeroconf>=0.145.0,<1",
    "cryptography>=44.0,<45",
]

[project.optional-dependencies]
libp2p = [
    "libp2p>=0.6.0,<1",
    "trio>=0.29,<1",
    "multiaddr>=0.0.9,<1",
]
dev = [
    "numpy>=2.3,<3",
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=7.0,<8",
    "ruff>=0.15,<1",
    "black>=26.0,<27",
    "mypy>=1.19,<2",
    "pre-commit>=3.7,<4",
]

[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security)
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "B011"]  # allow assert in tests
"mascarade/config.py" = ["S104"]  # 0.0.0.0 is required for Docker networking
"mascarade/integrations/comfyui.py" = ["S311"]  # random is acceptable for image generation seeds
"mascarade/router/providers/__init__.py" = ["F401"]  # imports used for availability checking
"mascarade/router/providers/kicad_router.py" = ["F401"]  # imports used for availability checking
"mascarade/load_balancer/balancer.py" = ["S311"]  # random is acceptable for load balancing
"mascarade/router/router.py" = ["E501"]  # line length handled by black
"mascarade/p2p/*" = ["S104"]  # 0.0.0.0 is required for P2P listening

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-ra -q"
asyncio_mode = "auto"
