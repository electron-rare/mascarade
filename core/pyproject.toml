[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mascarade"
version = "0.1.0"
description = "Orchestration agentique personnelle"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "mistralai>=1.0.0",
    "boto3>=1.35.0",
    "google-genai>=1.0.0",
    "google-auth>=2.35.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "uvicorn>=0.30.0",
    "fastapi>=0.115.0",
    "notion-client>=2.0.0",
    "tenacity>=9.0.0",
    "crewai>=0.130.0",
    "openai-agents>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
