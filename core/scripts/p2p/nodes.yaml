# P2P Network Node Configuration
# Each node in the mascarade P2P mesh

bootstrap:
  name: "Photon VM"
  host: "192.168.0.119"
  user: "root"
  port: 4001
  role: "infra"
  capabilities: ["docker", "p2p-relay", "compute"]
  http_base_url: "http://192.168.0.119:8100"
  pythonpath: "/mascarade/core"
  python: "python3"
  note: "VMware Photon OS, bootstrap node, 6.8GB RAM, 4 CPU, NO GPU"

nodes:
  cils:
    name: "CILS MacBook"
    host: "192.168.0.210"
    user: "cils"
    port: 4001
    role: "worker"
    capabilities: ["compute", "ft-validation"]
    http_base_url: "http://192.168.0.210:8100"
    pythonpath: ""  # uses venv
    python: "python3"
    venv: "~/mascarade/core/.venv/bin/activate"
    note: "MacBook Intel, independent validator node"

  grosmac:
    name: "GrosMac (bridge)"
    host: "localhost"
    user: "electron"
    port: 4001
    role: "bridge"
    capabilities: ["p2p-relay", "p2p-bridge", "llm-inference", "ft-research", "ft-dataset", "ft-teacher", "ft-archive"]
    http_base_url: "http://localhost:8100"
    pythonpath: "/Users/electron/mascarade/core"
    python: "python3"
    tailscale_ip: "100.80.178.42"
    note: "MacBook M4, bridge LAN↔Tailscale, orchestrator, API keys"

  kxkm:
    name: "KXKM AI"
    host: "kxkm-ai"
    tailscale_ip: "100.87.54.119"
    user: "kxkm"
    port: 4001
    role: "compute"
    capabilities: ["llm-inference", "gpu", "compute", "ft-student", "ft-analysis", "ft-reinforcement"]
    http_base_url: "http://kxkm-ai:8100"
    pythonpath: "~/mascarade/core"
    python: "python3"
    venv: "~/mascarade/core/.venv/bin/python"
    note: "Ubuntu, RTX 4090 24GB, 62GB RAM, 28 CPU, via Tailscale relay"

  tower:
    name: "Tower"
    host: "192.168.0.120"
    user: "clems"
    port: 4001
    role: "worker"
    capabilities: ["compute", "storage", "ft-archive"]
    http_base_url: "http://192.168.0.120:8100"
    pythonpath: "~/mascarade/core"
    python: "python3"
    note: "Ubuntu Tower, storage + compute"
