name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "docs/**"
      - "README.md"
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Force deploy to production"
        type: boolean
        default: false
      finetune_domain:
        description: "Domain to fine-tune (leave empty to skip)"
        type: string
        default: ""

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  CORE_IMAGE: ghcr.io/${{ github.repository }}/core
  API_IMAGE: ghcr.io/${{ github.repository }}/api

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Tests ──
  api:
    name: API (test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  web:
    name: Web (build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  core:
    name: Core (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: core/pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff black
      - run: ruff check .
      - run: black --check .

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example config >/dev/null

  # ── Docker GHCR ──
  docker:
    name: Docker (${{ matrix.service }})
    needs: [api, web, core, lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - service: core
            dockerfile: deploy/Dockerfile.core
            image_env: CORE_IMAGE
          - service: api
            dockerfile: deploy/Dockerfile.api
            image_env: API_IMAGE
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env[matrix.image_env] }}:latest
            ${{ env[matrix.image_env] }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  # ── GPU Fine-tuning (self-hosted only) ──
  finetune:
    name: Fine-tune (${{ github.event.inputs.finetune_domain || 'stm32' }})
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.event.inputs.finetune_domain != ''
    runs-on: [self-hosted, gpu]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install torch transformers datasets accelerate peft bitsandbytes trl
          pip install -e core/
      - name: Run fine-tuning
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          DOMAIN="${{ github.event.inputs.finetune_domain }}"
          python finetune/train_local.py "$DOMAIN" \
            --epochs 3 \
            --max-samples 500
      - name: Upload model
        uses: actions/upload-artifact@v4
        with:
          name: model-${{ github.event.inputs.finetune_domain }}
          path: finetune/models_local/
          retention-days: 30

  # ── Deploy ──
  deploy:
    name: Deploy to production
    needs: docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          if [[ -z "$SSH_KEY" ]]; then
            echo "::warning::DEPLOY_SSH_KEY not configured — skipping deploy"
            exit 0
          fi

          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" << 'REMOTE'
            cd ~/mascarade
            git pull origin main
            docker compose pull core api 2>/dev/null || true
            docker compose up -d --build core api
            docker compose ps
          REMOTE

  # ── Notifications ──
  notify:
    name: Notify
    needs: [api, web, core, lint, compose, docker, deploy]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Build status summary
        env:
          TESTS: ${{ needs.api.result }}/${{ needs.web.result }}/${{ needs.core.result }}
          LINT: ${{ needs.lint.result }}
          DOCKER: ${{ needs.docker.result }}
          DEPLOY: ${{ needs.deploy.result }}
        run: |
          STATUS="success"
          for r in $TESTS $LINT $DOCKER $DEPLOY; do
            if [[ "$r" == "failure" ]]; then STATUS="failure"; break; fi
          done

          if [[ "$STATUS" == "success" ]]; then
            echo "ICON=OK" >> $GITHUB_ENV
          else
            echo "ICON=FAIL" >> $GITHUB_ENV
          fi

          echo "CI_STATUS=$STATUS" >> $GITHUB_ENV
          echo "RUN_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_ENV

      - name: Create commit status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: process.env.CI_STATUS,
              target_url: process.env.RUN_URL,
              description: `CI ${process.env.CI_STATUS}: tests=${process.env.TESTS} docker=${process.env.DOCKER} deploy=${process.env.DEPLOY}`,
              context: 'mascarade/pipeline'
            });
