# docker-compose.yml — Genere par Mascarade setup
# Ne pas editer manuellement, utiliser ./config pour reconfigurer

services:
  core:
    build:
      context: .
      dockerfile: deploy/Dockerfile.core
    container_name: mascarade-core
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CORE_PORT}:8100"
    env_file:
      - .env
    environment:
      CORE_HOST: ${CORE_HOST}
      CORE_PORT: ${CORE_PORT}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER}
      DEFAULT_MODEL: ${DEFAULT_MODEL}
    volumes:
      - core-data:/app/data
    networks:
      - mascarade-network

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    container_name: mascarade-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT}:3000"
      - "80:3000"
    env_file:
      - .env
    environment:
      CORE_URL: ${CORE_URL}
      API_PORT: ${API_PORT}
    depends_on:
      - core
    networks:
      - mascarade-network

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: mascarade-litellm
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LITELLM_PORT}:4000"
    env_file:
      - .env
    environment:
      LITELLM_PORT: ${LITELLM_PORT}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./tools/litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml"]
    depends_on:
      - redis
    networks:
      - mascarade-network

  n8n:
    image: n8nio/n8n:latest
    container_name: mascarade-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_PORT}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: mascarade
      DB_POSTGRESDB_USER: mascarade
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    depends_on:
      - postgres
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - mascarade-network

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: mascarade-langfuse-worker
    restart: unless-stopped
    environment: &langfuse-worker-env
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      DATABASE_URL: postgresql://mascarade:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      SALT: ${SALT}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      TELEMETRY_ENABLED: "true"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: langfuse
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_TLS_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
    depends_on:
      - postgres
      - clickhouse
      - redis
      - minio
    networks:
      - mascarade-network

  langfuse-web:
    image: langfuse/langfuse:3
    container_name: mascarade-langfuse
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LANGFUSE_PORT}:3000"
    environment:
      <<: *langfuse-worker-env
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-}
    depends_on:
      - langfuse-worker
      - postgres
      - clickhouse
      - redis
      - minio
    networks:
      - mascarade-network

  minio:
    image: minio/minio:latest
    container_name: mascarade-langfuse-minio
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    ports:
      - "127.0.0.1:9190:9000"
      - "127.0.0.1:9191:9001"
    volumes:
      - langfuse-minio-data:/data
    networks:
      - mascarade-network

  dify-api:
    image: langgenius/dify-api:latest
    container_name: mascarade-dify-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DIFY_API_PORT}:5001"
    environment:
      DB_USERNAME: mascarade
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: mascarade
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OPENDAL_SCHEME: fs
      OPENDAL_ROOT: /app/api/storage
      OPENDAL_FS_ROOT: /app/api/storage
    depends_on:
      - postgres
      - redis
    networks:
      - mascarade-network
  dify-web:
    image: langgenius/dify-web:latest
    container_name: mascarade-dify-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DIFY_WEB_PORT}:3000"
    environment:
      DB_USERNAME: mascarade
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: mascarade
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OPENDAL_SCHEME: fs
      OPENDAL_ROOT: /app/api/storage
      OPENDAL_FS_ROOT: /app/api/storage
    depends_on:
      - postgres
      - redis
    networks:
      - mascarade-network
  dify-worker:
    image: langgenius/dify-api:latest
    container_name: mascarade-dify-worker
    restart: unless-stopped
    command: celery -A app.celery worker
    environment:
      DB_USERNAME: mascarade
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: mascarade
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OPENDAL_SCHEME: fs
      OPENDAL_ROOT: /app/api/storage
      OPENDAL_FS_ROOT: /app/api/storage
    depends_on:
      - postgres
      - redis
    networks:
      - mascarade-network

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: mascarade-clickhouse
    restart: unless-stopped
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./deploy/clickhouse/users.d/langfuse-user.xml:/etc/clickhouse-server/users.d/langfuse-user.xml:ro
      - ./deploy/clickhouse-config/thread-pools.xml:/etc/clickhouse-server/config.d/thread-pools.xml:ro
    networks:
      - mascarade-network


  ollama:
    image: ollama/ollama:latest
    container_name: mascarade-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_PORT}:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - mascarade-network

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: mascarade-open-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPEN_WEBUI_PORT}:8080"
    depends_on:
      - ollama
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - open-webui-data:/app/backend/data
    networks:
      - mascarade-network

  redis:
    image: redis:7-alpine
    container_name: mascarade-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    networks:
      - mascarade-network

  postgres:
    image: postgres:16-alpine
    container_name: mascarade-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - mascarade-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: mascarade-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_PORT}:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - mascarade-network

  grafana:
    image: grafana/grafana:latest
    container_name: mascarade-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - mascarade-network

  prometheus:
    image: prom/prometheus:latest
    container_name: mascarade-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT}:9090"
    volumes:
      - prometheus-data:/prometheus
    networks:
      - mascarade-network

networks:
  mascarade-network:
    driver: bridge

volumes:
  core-data:
  n8n-data:
  clickhouse-data:
  ollama-data:
  open-webui-data:
  redis-data:
  postgres-data:
  qdrant-data:
  grafana-data:
  prometheus-data:
  langfuse-minio-data:
