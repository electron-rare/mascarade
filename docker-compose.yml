# docker-compose.yml — Genere par Mascarade setup
# Ne pas editer manuellement, utiliser ./config pour reconfigurer

services:
  core:
    build:
      context: .
      dockerfile: deploy/Dockerfile.core
    container_name: mascarade-core
    restart: unless-stopped
    ports:
      - "${PUBLISH_BIND_HOST:-0.0.0.0}:${CORE_PORT}:8100"
    env_file:
      - .env
    environment:
      CORE_HOST: ${CORE_HOST}
      CORE_PORT: ${CORE_PORT}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER}
      DEFAULT_MODEL: ${DEFAULT_MODEL}
      AGENT_FACTORY_COCKPIT_DIR: ${AGENT_FACTORY_COCKPIT_DIR:-/workspace/agent-factory-cockpit}
      AGENT_FACTORY_DCS_PACK: ${AGENT_FACTORY_DCS_PACK:-generic-rest}
      AGENT_FACTORY_DCS_BASE_URL: ${AGENT_FACTORY_DCS_BASE_URL:-http://agent-factory-dcs-sandbox:4184/api}
      AGENT_FACTORY_DCS_AUTH_MODE: ${AGENT_FACTORY_DCS_AUTH_MODE:-api-key}
      AGENT_FACTORY_DCS_API_KEY: ${AGENT_FACTORY_DCS_API_KEY:-demo-dcs-key}
      AGENT_FACTORY_DCS_AUTH_HEADER: ${AGENT_FACTORY_DCS_AUTH_HEADER:-X-DCS-Key}
      AGENT_FACTORY_DCS_AUTH_SCHEME: ${AGENT_FACTORY_DCS_AUTH_SCHEME:-}
      AGENT_FACTORY_DCS_RESOURCE_READ_SNAPSHOT: ${AGENT_FACTORY_DCS_RESOURCE_READ_SNAPSHOT:-read-snapshot}
      AGENT_FACTORY_DCS_METHOD_READ_SNAPSHOT: ${AGENT_FACTORY_DCS_METHOD_READ_SNAPSHOT:-GET}
      AGENT_FACTORY_DCS_RESOURCE_WRITE_REQUEST: ${AGENT_FACTORY_DCS_RESOURCE_WRITE_REQUEST:-write-request}
      PYTHONPATH: ${AGENT_FACTORY_COCKPIT_DIR:-/workspace/agent-factory-cockpit}:${PYTHONPATH:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - core-data:/app/data
      - ../agent-factory-cockpit:${AGENT_FACTORY_COCKPIT_DIR:-/workspace/agent-factory-cockpit}:ro
    networks:
      - mascarade-network

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    container_name: mascarade-api
    restart: unless-stopped
    user: "${API_RUNTIME_UID:-1000}:${API_RUNTIME_GID:-1000}"
    ports:
      - "${PUBLISH_BIND_HOST:-0.0.0.0}:${API_PORT}:3000"
    env_file:
      - .env
    environment:
      CORE_URL: ${CORE_URL}
      API_PORT: 3000
      HOME: /tmp
      KILL_LIFE_ROOT: ${KILL_LIFE_ROOT:-/workspace/Kill_LIFE}
    volumes:
      - ../Kill_LIFE:${KILL_LIFE_ROOT:-/workspace/Kill_LIFE}:rw
    depends_on:
      - core
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - mascarade-network

  agent-factory-cockpit:
    build:
      context: ../agent-factory-cockpit
      dockerfile: Dockerfile
    container_name: mascarade-agent-factory-cockpit
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AGENT_FACTORY_STORAGE_ROOT: /data
      AGENT_FACTORY_OPERATOR_GROUPS: ${AGENT_FACTORY_OPERATOR_GROUPS:-operator}
      AGENT_FACTORY_APPROVER_GROUPS: ${AGENT_FACTORY_APPROVER_GROUPS:-approver}
      AGENT_FACTORY_AUDITOR_GROUPS: ${AGENT_FACTORY_AUDITOR_GROUPS:-auditor}
      AGENT_FACTORY_ADMIN_GROUPS: ${AGENT_FACTORY_ADMIN_GROUPS:-admin}
      AGENT_FACTORY_DCS_PACK: ${AGENT_FACTORY_DCS_PACK:-generic-rest}
      AGENT_FACTORY_DCS_BASE_URL: ${AGENT_FACTORY_DCS_BASE_URL:-http://agent-factory-dcs-sandbox:4184/api}
      AGENT_FACTORY_DCS_AUTH_MODE: ${AGENT_FACTORY_DCS_AUTH_MODE:-api-key}
      AGENT_FACTORY_DCS_API_KEY: ${AGENT_FACTORY_DCS_API_KEY:-demo-dcs-key}
      AGENT_FACTORY_DCS_AUTH_HEADER: ${AGENT_FACTORY_DCS_AUTH_HEADER:-X-DCS-Key}
      AGENT_FACTORY_DCS_AUTH_SCHEME: ${AGENT_FACTORY_DCS_AUTH_SCHEME:-}
      AGENT_FACTORY_DCS_RESOURCE_READ_SNAPSHOT: ${AGENT_FACTORY_DCS_RESOURCE_READ_SNAPSHOT:-read-snapshot}
      AGENT_FACTORY_DCS_METHOD_READ_SNAPSHOT: ${AGENT_FACTORY_DCS_METHOD_READ_SNAPSHOT:-GET}
      AGENT_FACTORY_DCS_RESOURCE_WRITE_REQUEST: ${AGENT_FACTORY_DCS_RESOURCE_WRITE_REQUEST:-write-request}
    command:
      - /bin/sh
      - -lc
      - >-
        proxy_args="";
        OLD_IFS=$$IFS;
        IFS=',';
        for cidr in ${AGENT_FACTORY_TRUSTED_PROXY_CIDRS:-172.16.0.0/12}; do
          cidr=$$(printf '%s' "$$cidr" | xargs);
          [ -n "$$cidr" ] && proxy_args="$$proxy_args --trusted-proxy-cidr $$cidr";
        done;
        IFS=$$OLD_IFS;
        exec python3 serve.py --host 0.0.0.0 --port ${AGENT_FACTORY_COCKPIT_PORT:-4173} --auth-mode proxy-auth $$proxy_args
    expose:
      - "4173"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - agent-factory-cockpit-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4173/api/health')"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - mascarade-network

  agent-factory-dcs-sandbox:
    build:
      context: ../agent-factory-cockpit
      dockerfile: Dockerfile
    container_name: mascarade-agent-factory-dcs-sandbox
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AGENT_FACTORY_DCS_API_KEY: ${AGENT_FACTORY_DCS_API_KEY:-demo-dcs-key}
      AGENT_FACTORY_DCS_AUTH_HEADER: ${AGENT_FACTORY_DCS_AUTH_HEADER:-X-DCS-Key}
    command:
      - python3
      - -m
      - agent_factory_cockpit.dcs_sandbox
      - --host
      - 0.0.0.0
      - --port
      - "${AGENT_FACTORY_DCS_SANDBOX_PORT:-4184}"
      - --api-key
      - "${AGENT_FACTORY_DCS_API_KEY:-demo-dcs-key}"
      - --auth-header
      - "${AGENT_FACTORY_DCS_AUTH_HEADER:-X-DCS-Key}"
    expose:
      - "4184"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4184/health')"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - mascarade-network

  litellm:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm@sha256:59a2736ac84800821fa0e1656487366089f2d29d10f8ae05c918df9c6e4940af}
    container_name: mascarade-litellm
    restart: unless-stopped
    ports:
      - "${PUBLISH_BIND_HOST:-0.0.0.0}:${LITELLM_PORT}:4000"
    env_file:
      - .env
    environment:
      LITELLM_PORT: ${LITELLM_PORT}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./tools/litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:4000/health/liveliness\", timeout=3)' >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - mascarade-network

  n8n:
    image: ${N8N_IMAGE:-n8nio/n8n@sha256:cfa50544c4cc172506834da1ec9bb5171db55958c8d1918205df0bda237a56f4}
    container_name: mascarade-n8n
    restart: unless-stopped
    ports:
      - "${PUBLISH_BIND_HOST:-0.0.0.0}:${N8N_PORT}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: mascarade
      DB_POSTGRESDB_USER: mascarade
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - n8n-data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - mascarade-network

  langfuse-worker:
    image: ${LANGFUSE_WORKER_IMAGE:-langfuse/langfuse-worker@sha256:8bb47a4240ea293a210e460eae912ce06ea8fc2f724ce89cb146547eed36f6b2}
    container_name: mascarade-langfuse-worker
    restart: unless-stopped
    environment: &langfuse-worker-env
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      DATABASE_URL: postgresql://mascarade:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      SALT: ${SALT}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      TELEMETRY_ENABLED: "true"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-langfuse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_CONNECTION_STRING: redis://redis:6379
      REDIS_TLS_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - IP=$$(hostname -i | awk '{print $$1}') && wget -q --spider "http://$$IP:3030/"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - mascarade-network

  langfuse-web:
    image: ${LANGFUSE_WEB_IMAGE:-langfuse/langfuse@sha256:8d3211972d2a0610258ff0cc86da6b2d367f804bf253e9b94863bf961e59d23c}
    container_name: mascarade-langfuse
    restart: unless-stopped
    ports:
      - "${PUBLISH_BIND_HOST:-0.0.0.0}:${LANGFUSE_PORT}:3000"
    environment:
      <<: *langfuse-worker-env
      LANGFUSE_PUBLIC_ORIGIN: ${LANGFUSE_PUBLIC_ORIGIN:-http://langfuse-web:3000}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-}
    depends_on:
      langfuse-worker:
        condition: service_started
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - mascarade-network

  minio:
    image: ${MINIO_IMAGE:-minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e}
    container_name: mascarade-langfuse-minio
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    ports:
      - "${PUBLISH_BIND_HOST:-0.0.0.0}:9190:9000"
      - "${PUBLISH_BIND_HOST:-0.0.0.0}:9191:9001"
    volumes:
      - langfuse-minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - mascarade-network

  firecrawl:
    image: ${FIRECRAWL_IMAGE:-mcp/firecrawl@sha256:e6676bd31d1806574d931b7a7b7b6fba953c031853e80adc1ec8115c17ab81ca}
    container_name: mascarade-firecrawl
    restart: unless-stopped
    ports:
      - "${PUBLISH_BIND_HOST:-0.0.0.0}:${FIRECRAWL_PORT:-3400}:3000"
    env_file:
      - .env
    environment:
      HTTP_STREAMABLE_SERVER: "true"
      PORT: 3000
      HOST: ${FIRECRAWL_HOST:-0.0.0.0}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      FIRECRAWL_API_URL: ${FIRECRAWL_API_URL:-}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"if (!process.env.FIRECRAWL_API_KEY && !process.env.FIRECRAWL_API_URL) process.exit(1); const net = require('net'); const socket = net.connect(3000, '127.0.0.1'); socket.on('connect', () => { socket.end(); process.exit(0); }); socket.on('error', () => process.exit(1)); setTimeout(() => process.exit(1), 3000);\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - mascarade-network

  mem0:
    image: ${MEM0_IMAGE:-mem0/openmemory-mcp:latest}
    container_name: mascarade-mem0
    restart: unless-stopped
    ports:
      - "${PUBLISH_BIND_HOST:-0.0.0.0}:${MEM0_PORT:-3300}:8765"
    env_file:
      - .env
    environment:
      USER: ${MEM0_USER:-mascarade}
      OPENAI_API_KEY: ${MEM0_OPENAI_API_KEY:-sk-mem0-local}
      OPENAI_API_BASE: ${MEM0_OPENAI_BASE_URL:-http://litellm:4000}
      OPENAI_BASE_URL: ${MEM0_OPENAI_BASE_URL:-http://litellm:4000}
      QDRANT_HOST: ${MEM0_QDRANT_HOST:-qdrant}
      QDRANT_PORT: ${MEM0_QDRANT_PORT:-6333}
    depends_on:
      litellm:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; sock = socket.create_connection(('127.0.0.1', 8765), 3); sock.close()\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      - mascarade-network

  dify-api:
    image: ${DIFY_API_IMAGE:-langgenius/dify-api@sha256:5f622b4d0b39bdc6d3b401063cfb60962fa92dcc63f55daccec138f98b260e67}
    container_name: mascarade-dify-api
    restart: unless-stopped
    ports:
      - "${PUBLISH_BIND_HOST:-0.0.0.0}:${DIFY_API_PORT}:5001"
    environment:
      DB_USERNAME: mascarade
      DB_PASSWORD: ${POSTGRES_PASSWORD:-}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: mascarade
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_WEB_URL: ${DIFY_PUBLIC_ORIGIN:-https://dify.localhost}
      CONSOLE_WEB_URL: ${DIFY_PUBLIC_ORIGIN:-https://dify.localhost}
      CONSOLE_API_URL: ${DIFY_PUBLIC_ORIGIN:-https://dify.localhost}
      SERVICE_API_URL: ${DIFY_PUBLIC_ORIGIN:-https://dify.localhost}
      OPENDAL_SCHEME: fs
      OPENDAL_ROOT: /app/api/storage
      OPENDAL_FS_ROOT: /app/api/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mascarade-network
  dify-web:
    image: ${DIFY_WEB_IMAGE:-langgenius/dify-web@sha256:30339b4d5060488fac147ddc6fb40438ef71cd5f5dfdeb26c886768302bf7197}
    container_name: mascarade-dify-web
    restart: unless-stopped
    ports:
      - "${PUBLISH_BIND_HOST:-0.0.0.0}:${DIFY_WEB_PORT}:3000"
    environment:
      DB_USERNAME: mascarade
      DB_PASSWORD: ${POSTGRES_PASSWORD:-}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: mascarade
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_WEB_URL: ${DIFY_PUBLIC_ORIGIN:-https://dify.localhost}
      CONSOLE_WEB_URL: ${DIFY_PUBLIC_ORIGIN:-https://dify.localhost}
      CONSOLE_API_URL: ${DIFY_PUBLIC_ORIGIN:-https://dify.localhost}
      SERVICE_API_URL: ${DIFY_PUBLIC_ORIGIN:-https://dify.localhost}
      OPENDAL_SCHEME: fs
      OPENDAL_ROOT: /app/api/storage
      OPENDAL_FS_ROOT: /app/api/storage
      APP_API_URL: ${DIFY_PUBLIC_ORIGIN:-https://dify.localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mascarade-network
  dify-worker:
    image: ${DIFY_API_IMAGE:-langgenius/dify-api@sha256:5f622b4d0b39bdc6d3b401063cfb60962fa92dcc63f55daccec138f98b260e67}
    container_name: mascarade-dify-worker
    restart: unless-stopped
    command: celery -A app.celery worker
    environment:
      DB_USERNAME: mascarade
      DB_PASSWORD: ${POSTGRES_PASSWORD:-}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: mascarade
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_WEB_URL: ${DIFY_PUBLIC_ORIGIN:-https://dify.localhost}
      CONSOLE_WEB_URL: ${DIFY_PUBLIC_ORIGIN:-https://dify.localhost}
      CONSOLE_API_URL: ${DIFY_PUBLIC_ORIGIN:-https://dify.localhost}
      SERVICE_API_URL: ${DIFY_PUBLIC_ORIGIN:-https://dify.localhost}
      OPENDAL_SCHEME: fs
      OPENDAL_ROOT: /app/api/storage
      OPENDAL_FS_ROOT: /app/api/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mascarade-network

  clickhouse:
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server@sha256:0b2d7824347397b2ba6fcb216f0ae772568105f1f47e19f0d3247e24c79bc10a}
    container_name: mascarade-clickhouse
    restart: unless-stopped
    ports:
      - "${PUBLISH_BIND_HOST:-0.0.0.0}:${CLICKHOUSE_HTTP_PORT}:8123"
      - "${PUBLISH_BIND_HOST:-0.0.0.0}:${CLICKHOUSE_NATIVE_PORT}:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./deploy/clickhouse-config/langfuse-user.xml:/etc/clickhouse-server/users.d/langfuse-user.xml:ro
      - ./deploy/clickhouse-config/thread-pools.xml:/etc/clickhouse-server/config.d/thread-pools.xml:ro
      - ./deploy/clickhouse/init:/docker-entrypoint-initdb.d:ro
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - mascarade-network

  tts:
    container_name: mascarade-tts
    restart: unless-stopped
    ports:
      - "${PUBLISH_BIND_HOST:-0.0.0.0}:${TTS_PORT}:10200"
    image: ${TTS_PIPER_IMAGE:-rhasspy/wyoming-piper:latest}
    environment:
      TTS_ENGINE: ${TTS_ENGINE:-piper}
      TTS_VOICE: ${TTS_VOICE:-}
    volumes:
      - tts-data:/data
    networks:
      - mascarade-network

  stt:
    image: ${STT_IMAGE:-onerahmet/openai-whisper-asr-webservice:latest}
    container_name: mascarade-stt
    restart: unless-stopped
    ports:
      - "${PUBLISH_BIND_HOST:-0.0.0.0}:${STT_PORT}:9000"
    environment:
      ASR_ENGINE: faster_whisper
      STT_ENGINE: ${STT_ENGINE:-faster_whisper}
      ASR_MODEL: ${STT_MODEL:-small}
    volumes:
      - stt-cache:/root/.cache
    networks:
      - mascarade-network

  generate-audio:
    build:
      context: .
      dockerfile: deploy/Dockerfile.generate-audio
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
        TORCH_VERSION: 2.1.0
        TORCHAUDIO_VERSION: 2.1.0
        TORCHVISION_VERSION: 0.16.0
        TORCHTEXT_VERSION: 0.16.0
        XFORMERS_VERSION: 0.0.22.post7
        AUDIOCRAFT_VERSION: 1.3.0
    container_name: mascarade-generate-audio
    restart: unless-stopped
    ports:
      - "${PUBLISH_BIND_HOST:-0.0.0.0}:${GENERATE_AUDIO_PORT}:9000"
    environment:
      GENERATE_AUDIO_ENGINE: audiogen
      GENERATE_AUDIO_MODEL: ${GENERATE_AUDIO_MODEL:-facebook/audiogen-medium}
      GENERATE_AUDIO_RUNTIME: cpu
      GENERATE_AUDIO_TORCH_VARIANT: cpu
      GENERATE_AUDIO_KEEP_LOADED: ${GENERATE_AUDIO_KEEP_LOADED:-false}
      GENERATE_AUDIO_IDLE_UNLOAD_SECONDS: ${GENERATE_AUDIO_IDLE_UNLOAD_SECONDS:-0}
      HF_HOME: /root/.cache/huggingface
    volumes:
      - generate-audio-cache:/root/.cache/huggingface
    networks:
      - mascarade-network

  edge-proxy:
    build:
      context: .
      dockerfile: deploy/Dockerfile.edge-proxy
    container_name: mascarade-edge-proxy
    restart: unless-stopped
    ports:
      - "${EDGE_PROXY_BIND_HOST:-0.0.0.0}:${EDGE_PROXY_HTTP_PORT}:80"
      - "${EDGE_PROXY_BIND_HOST:-0.0.0.0}:${EDGE_PROXY_HTTPS_PORT}:443"
    env_file:
      - .env
    environment:
      EDGE_PROXY_INDUSTRIAL_SERVER_NAME: ${EDGE_PROXY_INDUSTRIAL_SERVER_NAME:-industrial.saillant.cc}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - edge-proxy-certs:/etc/nginx/certs
      - edge-proxy-auth:/etc/nginx/auth
      - ../Kill_LIFE/tools/ai/integrations:/srv/kill-life/integrations:ro
    depends_on:
      api:
        condition: service_started
      agent-factory-cockpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - mascarade-network

  ops-agent:
    build:
      context: .
      dockerfile: deploy/Dockerfile.ops-agent
    container_name: mascarade-ops-agent
    restart: unless-stopped
    ports:
      - "${PUBLISH_BIND_HOST:-0.0.0.0}:${OPS_AGENT_PORT}:9200"
    env_file:
      - .env
    environment:
      OPS_AGENT_PORT: 9200
      AGENTSIGHT_URL: ${AGENTSIGHT_URL:-}
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9200/health')\""]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - mascarade-network

  redis:
    image: ${REDIS_IMAGE:-redis@sha256:8b81dd37ff027bec4e516d41acfbe9fe2460070dc6d4a4570a2ac5b9d59df065}
    container_name: mascarade-redis
    restart: unless-stopped
    ports:
      - "${PUBLISH_BIND_HOST:-0.0.0.0}:${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - mascarade-network

  postgres:
    image: ${POSTGRES_IMAGE:-postgres@sha256:20edbde7749f822887a1a022ad526fde0a47d6b2be9a8364433605cf65099416}
    container_name: mascarade-postgres
    restart: unless-stopped
    ports:
      - "${PUBLISH_BIND_HOST:-0.0.0.0}:${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - mascarade-network

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant@sha256:f1c7272cdac52b38c1a0e89313922d940ba50afd90d593a1605dbbc214e66ffb}
    container_name: mascarade-qdrant
    restart: unless-stopped
    ports:
      - "${PUBLISH_BIND_HOST:-0.0.0.0}:${QDRANT_PORT}:6333"
      - "${PUBLISH_BIND_HOST:-0.0.0.0}:${QDRANT_GRPC_PORT}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      mascarade-network:
        aliases:
          - mem0_store

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana@sha256:b0ae311af06228bcfd4a620504b653db80f5b91e94dc3dc2a5b7dab202bcde20}
    container_name: mascarade-grafana
    restart: unless-stopped
    ports:
      - "${PUBLISH_BIND_HOST:-0.0.0.0}:${GRAFANA_PORT}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_PUBLIC_ORIGIN:-http://grafana.localhost}
      GF_SERVER_DOMAIN: ${EDGE_PROXY_GRAFANA_SERVER_NAME:-grafana.localhost}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - mascarade-network

  tempo:
    image: ${TEMPO_IMAGE:-grafana/tempo:latest}
    container_name: mascarade-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "${PUBLISH_BIND_HOST:-0.0.0.0}:${TEMPO_PORT}:3200"
    volumes:
      - ./deploy/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    healthcheck:
      test: ["CMD", "/tempo", "-version"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - mascarade-network

  blackbox-exporter:
    image: ${BLACKBOX_EXPORTER_IMAGE:-prom/blackbox-exporter:latest}
    container_name: mascarade-blackbox-exporter
    restart: unless-stopped
    ports:
      - "${PUBLISH_BIND_HOST:-0.0.0.0}:${BLACKBOX_EXPORTER_PORT}:9115"
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./deploy/prometheus/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9115/-/healthy >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - mascarade-network

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus@sha256:4a61322ac1103a0e3aea2a61ef1718422a48fa046441f299d71e660a3bc71ae9}
    container_name: mascarade-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "${PUBLISH_BIND_HOST:-0.0.0.0}:${PROMETHEUS_PORT}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      blackbox-exporter:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - mascarade-network
  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.5.3}
    container_name: mascarade-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "${PUBLISH_BIND_HOST:-0.0.0.0}:${LOKI_PORT}:3100"
    volumes:
      - ./deploy/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - mascarade-network

  promtail:
    image: ${PROMTAIL_IMAGE:-grafana/promtail:3.5.3}
    container_name: mascarade-promtail
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/promtail-entrypoint.sh"]
    ports:
      - "${PUBLISH_BIND_HOST:-0.0.0.0}:${PROMTAIL_PORT}:9080"
    volumes:
      - ./deploy/promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
      - ./deploy/promtail/entrypoint.sh:/usr/local/bin/promtail-entrypoint.sh:ro
      - promtail-data:/var/lib/promtail
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    depends_on:
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "promtail", "--version"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - mascarade-network

  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.116.1}
    container_name: mascarade-otel-collector
    restart: unless-stopped
    user: "0:0"
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "${PUBLISH_BIND_HOST:-0.0.0.0}:${OTEL_COLLECTOR_GRPC_PORT}:4317"
      - "${PUBLISH_BIND_HOST:-0.0.0.0}:${OTEL_COLLECTOR_HTTP_PORT}:4318"
      - "${PUBLISH_BIND_HOST:-0.0.0.0}:${OTEL_COLLECTOR_HEALTH_PORT}:13133"
    volumes:
      - ./deploy/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - mascarade-network

  finetune-metrics-exporter:
    build:
      context: ./deploy/finetune-metrics-exporter
      dockerfile: Dockerfile
    container_name: mascarade-finetune-metrics-exporter
    restart: unless-stopped
    ports:
      - "${PUBLISH_BIND_HOST:-0.0.0.0}:${FINETUNE_METRICS_PORT:-9101}:9101"
    env_file:
      - .env
    environment:
      FINETUNE_RUNS_DIR: /app/finetune/runs
    volumes:
      - ./finetune/runs:/app/finetune/runs:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9101/metrics')\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - mascarade-network

networks:
  mascarade-network:
    driver: bridge

volumes:
  core-data:
  agent-factory-cockpit-data:
    name: agent-factory-cockpit-data
  n8n-data:
  langfuse-minio-data:
  clickhouse-data:
  tts-data:
  stt-cache:
  generate-audio-cache:
  edge-proxy-certs:
    name: mascarade-edge-proxy-certs
  edge-proxy-acme:
    name: mascarade-edge-proxy-acme
  redis-data:
  postgres-data:
  qdrant-data:
  grafana-data:
  tempo-data:
  prometheus-data:
  loki-data:
  promtail-data:
  edge-proxy-auth:
    name: mascarade-edge-proxy-auth
